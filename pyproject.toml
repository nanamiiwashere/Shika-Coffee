[project]
name = "shika-coffee"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "sqlalchemy",
    "psycopg2-binary",
    "pwdlib",
    "argon2-cffi",
    "PyJWT",
    "pydantic[email]",
    "httpx",
    "anyio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
